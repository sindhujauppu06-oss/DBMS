services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: localroot
      MYSQL_DATABASE: dockflow
      MYSQL_USER: dockflow
      MYSQL_PASSWORD: dockflow_local
    ports: ["3307:3306"]
    volumes:
      - dockflow_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocalroot"]
      interval: 5s
      timeout: 4s
      retries: 20
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes:
      - dockflow_mongo:/data/db
  qdrant:
    image: qdrant/qdrant:v1.13.2
    restart: unless-stopped
    ports: ["6333:6333"]
    volumes:
      - dockflow_vectors:/qdrant/storage
  kafka:
    image: apache/kafka:4.0.0
    restart: unless-stopped
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
  api:
    build: ./server
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: dockflow
      DB_PASSWORD: dockflow_local
      DB_NAME: dockflow
      JWT_SECRET: local-only-replace-this-secret-before-deploying
      CORS_ORIGIN: http://localhost:5173
      SHIPMENT_SERVICE_URL: http://shipments:4100
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
      shipments:
        condition: service_healthy
  insights:
    build: ./services/insights
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: dockflow
      DB_PASSWORD: dockflow_local
      DB_NAME: dockflow
      MONGO_URL: mongodb://mongo:27017
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET: local-only-replace-this-secret-before-deploying
      SERVICE_KEY: dockflow-local-service-key
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_started
      qdrant:
        condition: service_started
  shipments:
    build: ./services/shipments
    restart: unless-stopped
    environment:
      PORT: 4100
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: dockflow
      DB_PASSWORD: dockflow_local
      DB_NAME: dockflow
      JWT_SECRET: local-only-replace-this-secret-before-deploying
      KAFKA_BROKER: kafka:9092
      INSIGHTS_URL: http://insights:8000
      SERVICE_KEY: dockflow-local-service-key
    ports: ["4100:4100"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
      insights:
        condition: service_healthy
  web:
    build: ./client
    environment:
      API_PROXY_TARGET: http://api:4000
      INSIGHTS_PROXY_TARGET: http://insights:8000
    ports: ["5173:5173"]
    depends_on:
      api:
        condition: service_healthy
      insights:
        condition: service_healthy
volumes:
  dockflow_data:
  dockflow_mongo:
  dockflow_vectors:
