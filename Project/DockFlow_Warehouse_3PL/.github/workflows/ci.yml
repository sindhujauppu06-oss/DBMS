name: DockFlow CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build website
        working-directory: client
        run: npm install --no-audit --no-fund && npm run build
      - name: Check Express API syntax
        working-directory: server
        run: node --check src/index.js
      - name: Check shipment service syntax
        working-directory: services/shipments
        run: node --check src/index.js
      - name: Check FastAPI source syntax
        run: python -m compileall -q services/insights/main.py
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
